{{define "head"}}<!DOCTYPE html>
<html lang="{{.Lang}}">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{if .Title}}{{.Title}} · {{end}}{{.Brand}}</title>
  <meta name="description" content="{{ts .Lang "meta.description"}}">
  <meta name="theme-color" content="#6f4e37">
  <link rel="manifest" href="/static/manifest.json">
  <link rel="icon" href="/static/icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@picocss/pico@2/css/pico.min.css">
  <link rel="stylesheet" href="/static/kafumu.css">
</head>
<body>
  <header class="container">
    <nav>
      <ul><li><a href="/" class="brand">☕ {{.Brand}}</a></li></ul>
      <ul>
        <li><a href="/about">{{t .Lang "nav.about"}}</a></li>
        <li>
          <select id="lang" aria-label="{{ts .Lang "nav.language"}}" onchange="document.cookie='lang='+this.value+';path=/;max-age=31536000;samesite=lax';location.reload()">
            {{range .Langs}}<option value="{{.Code}}"{{if eq .Code $.Lang}} selected{{end}}>{{.Name}}</option>{{end}}
          </select>
        </li>
      </ul>
    </nav>
  </header>
  <main class="container">
{{end}}

{{define "foot"}}
  </main>
  <footer class="container">
    <small>{{t .Lang "footer.lens"}}
    <a href="https://github.com/LaPingvino/kafumu">{{t .Lang "footer.source"}}</a></small>
  </footer>
</body>
</html>
{{end}}
