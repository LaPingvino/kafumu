{{template "head" .}}
<h1>{{t .Lang "connect.title"}}</h1>
<p class="dim">{{t .Lang "connect.explain"}}</p>
{{template "nameform" .}}
<div id="code-area" hidden>
  <div id="share-picker"></div>
  <div class="card qr-card">
    <div id="qr" class="qr" aria-label="{{ts .Lang "connect.qr_label"}}"></div>
    <p id="connect-status" class="dim" role="status"></p>
    <div class="actions center">
      <button type="button" id="share-link" class="pill">{{t .Lang "connect.share_link"}}</button>
      <button type="button" id="new-code" class="pill">{{t .Lang "connect.new_code"}}</button>
      <button type="button" id="listen-again" class="pill" hidden>{{t .Lang "connect.listen_again"}}</button>
    </div>
    <input id="invite-link" readonly hidden>
  </div>
  <p class="dim"><small>{{t .Lang "connect.privacy"}}</small></p>
  <p><a href="/badge">🖨 {{t .Lang "badge.title"}}</a></p>
  <ul id="new-contacts" class="boxed-list"></ul>
</div>
<script>window.KAFUMU_T = {{.JS}};</script>
<script src="/static/vendor/qrcode-1.4.4.js?v={{.V}}"></script>
<script src="/static/device.js?v={{.V}}"></script>
<script src="/static/pair.js?v={{.V}}"></script>
<script src="/static/connect.js?v={{.V}}"></script>
{{template "foot" .}}
