{{template "head" .}}
<h1>{{t .Lang "nav.chats"}}</h1>
<p class="actions minor"><a href="/contacts" role="button" class="pill-sm">👥 {{t .Lang "nav.contacts"}} →</a></p>
<div id="mailbox">
  <div id="thread-filter" class="chips scroll-row" role="group">
    <button type="button" class="chip on" data-f="all">{{t .Lang "activity.all"}}</button>
    <button type="button" class="chip" data-f="contacts">{{t .Lang "nav.contacts"}}</button>
    <button type="button" class="chip" data-f="unread">{{t .Lang "activity.unread"}}</button>
  </div>
  <p id="activity-empty" class="dim" hidden>{{t .Lang "activity.empty"}}</p>
  <ul id="threads" class="threads"></ul>
</div>
<script>window.KAFUMU_T = {{.JS}};</script>
<script src="/static/device.js?v={{.V}}"></script>
<script src="/static/sha1.js?v={{.V}}"></script>
<script src="/static/pair.js?v={{.V}}"></script>
<script src="/static/oln.js?v={{.V}}"></script>
<script src="/static/threads.js?v={{.V}}"></script>
<script src="/static/activity.js?v={{.V}}"></script>
{{template "foot" .}}
