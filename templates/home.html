{{template "head" .}}
<section id="here" data-cell="{{.Cell}}">
  <p class="muted" id="status">Finding your cell… (only a ~5 km area is computed, on your device)</p>
  <h1 class="cell-tag" hidden><span id="cell-tag"></span></h1>
  <p id="cell-actions" hidden>
    <a id="compose" role="button" class="outline" target="_blank" rel="noopener">Post here on Bluesky</a>
    <a id="share" href="#" role="button" class="secondary outline">Share this cell</a>
  </p>
  <details id="manual">
    <summary>Pick a place yourself</summary>
    <form id="manual-form">
      <input name="where" placeholder="#geo cell (9f469v), plus code (9F469VXJ+…), or lat,lon" aria-label="Place">
      <button type="submit">Go</button>
    </form>
  </details>
</section>

<article id="events" class="events" hidden></article>

<section>
  <h2>Around here</h2>
  <ul id="list" class="list"><li class="muted">Nothing loaded yet.</li></ul>
  <p class="muted" id="list-note"></p>
</section>
<script src="/static/kafumu.js"></script>
{{template "foot" .}}
