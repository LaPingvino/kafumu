{{template "head" .}}
<section id="here" data-cell="{{.Cell}}">
  <p class="muted" id="status">{{t .Lang "home.finding"}}</p>
  <h1 class="cell-tag" hidden><span id="cell-tag"></span></h1>
  <p id="cell-actions" hidden>
    <a id="compose" role="button" class="outline" target="_blank" rel="noopener">{{t .Lang "home.post_here"}}</a>
    <a id="share" href="#" role="button" class="secondary outline">{{t .Lang "home.share"}}</a>
  </p>
  <details id="manual">
    <summary>{{t .Lang "home.pick_place"}}</summary>
    <form id="manual-form">
      <input name="where" placeholder="{{ts .Lang "home.pick_placeholder"}}" aria-label="{{ts .Lang "home.pick_place"}}">
      <button type="submit">{{t .Lang "home.go"}}</button>
    </form>
  </details>
</section>

<article id="events" class="events" hidden></article>

<section>
  <h2>{{t .Lang "home.around_here"}}</h2>
  <ul id="list" class="list"><li class="muted">{{t .Lang "home.nothing_loaded"}}</li></ul>
  <p class="muted" id="list-note"></p>
</section>
<script>window.KAFUMU_T = {{.JS}};</script>
<script src="/static/kafumu.js"></script>
{{template "foot" .}}
