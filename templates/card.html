{{template "head" .}}
<article>
  <h1>{{t .Lang "card.title"}}</h1>
  <p>{{t .Lang "card.explain"}}</p>
  <div id="personas" class="chips switch" role="tablist" aria-label="{{ts .Lang "card.personas"}}"></div>
  <div class="grid">
    <form id="card-form" autocomplete="on">
      <label>{{t .Lang "card.field_label"}}<input name="label" maxlength="30" placeholder="{{ts .Lang "card.label_placeholder"}}"></label>
      <label>{{t .Lang "card.field_name"}}<input name="name" autocomplete="name" maxlength="80"></label>
      <label>{{t .Lang "card.field_about"}}<input name="about" maxlength="160" placeholder="{{ts .Lang "card.about_placeholder"}}"></label>
      <label>{{t .Lang "card.field_tags"}}</label>
      <div id="tag-chips" class="chips"></div>
      <input id="custom-tag" class="chip-input wide" maxlength="40" placeholder="{{ts .Lang "card.custom_tag"}}" aria-label="{{ts .Lang "card.custom_tag"}}">
      <label>{{t .Lang "card.field_email"}}<input name="email" type="email" autocomplete="email"></label>
      <label>{{t .Lang "card.field_phone"}}<input name="phone" type="tel" autocomplete="tel"></label>
      <label>WhatsApp<input name="whatsapp" type="tel" placeholder="+…" data-phone></label>
      <label>Signal<input name="signal" placeholder="+… / signal.me/…" data-phone="/ signal.me/…"></label>
      <label>Telegram<input name="telegram" placeholder="@…"></label>
      <label>Bluesky<input name="bluesky" placeholder="you.bsky.social"></label>
      <label>LinkedIn<input name="linkedin" placeholder="linkedin.com/in/…"></label>
      <label>{{t .Lang "card.field_website"}}<input name="website" type="url" autocomplete="url"></label>
      <div class="actions">
        <button type="submit" class="pill">{{t .Lang "card.save"}}</button>
        <button type="button" id="delete-persona" class="contrast" hidden>{{t .Lang "card.delete_persona"}}</button>
      </div>
      <p id="card-status" class="muted" role="status"></p>
    </form>
    <aside>
      <p class="muted">{{t .Lang "card.preview"}}</p>
      <ul id="card-preview" class="boxed-list"></ul>
      <p class="muted"><small>{{t .Lang "card.private_note"}}</small></p>
    </aside>
  </div>
</article>
<script>window.KAFUMU_T = {{.JS}};</script>
<script src="/static/device.js?v={{.V}}"></script>
<script src="/static/card.js?v={{.V}}"></script>
{{template "foot" .}}
