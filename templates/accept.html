{{template "head" .}}
<h1>{{t .Lang "accept.title"}}</h1>
<p class="dim">{{t .Lang "accept.explain"}}</p>
<div id="accept-area" class="card" hidden>
  <p id="send-as"></p>
  <div id="share-picker"></div>
  <div class="actions"><button type="button" id="do-connect" class="pill suggested">{{t .Lang "accept.connect"}}</button></div>
  <p class="dim"><small>{{t .Lang "connect.privacy"}}</small></p>
</div>
<p id="accept-status" class="dim" role="status"></p>
{{template "nameform" .}}
<ul id="accepted" class="boxed-list"></ul>
<p id="install-hint" class="card dim" hidden style="padding:12px 16px">{{t .Lang "accept.install_hint"}}</p>
<script>window.KAFUMU_T = {{.JS}};</script>
<script src="/static/device.js?v={{.V}}"></script>
<script src="/static/sha1.js?v={{.V}}"></script>
<script src="/static/pair.js?v={{.V}}"></script>
<script src="/static/connect.js?v={{.V}}"></script>
{{template "foot" .}}
