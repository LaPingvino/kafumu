runtime: go127
service: default
instance_class: F1
# Bundled services: memcache (free) fronts mailbox and slot reads.
app_engine_apis: true

# Cap scale-out so a crawler surge can't run up instance hours.
automatic_scaling:
  max_instances: 3

env_variables:
  KAFUMU_BRAND: "Kafumu"
  KAFUMU_ORIGIN: "https://lokumo.ew.r.appspot.com"
  # Donations. A PayPal.me link or hosted button would avoid showing the address.
  KAFUMU_PAYPAL: "https://www.paypal.com/donate/?business=ikojba%40gmail.com&currency_code=EUR&item_name=Kafumu"

handlers:
  - url: /robots.txt
    static_files: static/robots.txt
    upload: static/robots.txt
  - url: /sw.js
    static_files: static/sw.js
    upload: static/sw.js
    secure: always
    expiration: "0s"
  - url: /favicon.ico
    static_files: static/icon.svg
    upload: static/icon.svg
  # Pages reference assets as /static/x.js?v=<deploy>, so they can be cached
  # long without ever mixing versions.
  - url: /static
    static_dir: static
    secure: always
    expiration: "30d"
  - url: /.*
    script: auto
    secure: always
