runtime: go127
service: default
instance_class: F1
# Bundled services: memcache (free) fronts mailbox and slot reads.
app_engine_apis: true

# Cap scale-out so a crawler surge can't run up instance hours.
automatic_scaling:
  max_instances: 3

env_variables:
  KAFUMU_BRAND: "Kafumu"
  KAFUMU_ORIGIN: "https://kafumu.com"
  # The old address offers to move people's device data to kafumu.com.
  KAFUMU_LEGACY_ORIGINS: "https://lokumo.ew.r.appspot.com https://lokumo.appspot.com"
  KAFUMU_PASSKEYS: "1"
  KAFUMU_ATPROTO: "1"
  # Donations, the same channels as esperanto-kurso.net.
  KAFUMU_PAYPAL: "https://www.paypal.com/paypalme/lapingvino"
  KAFUMU_BUNQ: "https://bunq.me/lapingvino"
  KAFUMU_BCH: "bitcoincash:qrrqxuwdh4j92vytr89n95xhvvcraugju53j7glf20"

handlers:
  - url: /robots.txt
    static_files: static/robots.txt
    upload: static/robots.txt
  - url: /sw.js
    static_files: static/sw.js
    upload: static/sw.js
    secure: always
    expiration: "0s"
  - url: /favicon.ico
    static_files: static/icon.svg
    upload: static/icon.svg
  # Pages reference assets as /static/x.js?v=<deploy>, so they can be cached
  # long without ever mixing versions.
  - url: /static
    static_dir: static
    secure: always
    expiration: "30d"
  # Becoming admin needs App Engine's own admin login (checked again in code).
  - url: /admin/initial
    script: auto
    secure: always
    login: admin
  - url: /.*
    script: auto
    secure: always
