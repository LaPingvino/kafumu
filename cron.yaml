cron:
  - description: "Pull public event calendars (feeds.json) into meetups"
    url: /cron/feeds
    schedule: every 6 hours synchronized
  - description: "Forget what /privacy promises to forget: expired meetups, mailboxes, slots, idle accounts"
    url: /cron/purge
    schedule: every day 04:00
  - description: "CoffeeBucks: a daily backstop — lp settles due dividends (hourly periods, each at its own time) whenever it handles a request (node v0.2.9); this only catches quiet days up"
    url: /cron/ud
    target: lp
    schedule: every day 04:10
