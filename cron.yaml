cron:
  - description: "Pull public event calendars (feeds.json) into meetups"
    url: /cron/feeds
    schedule: every 6 hours synchronized
  - description: "Forget what /privacy promises to forget: expired meetups, mailboxes, slots, idle accounts"
    url: /cron/purge
    schedule: every day 04:00
  - description: "CoffeeBucks: the Universal Dividend, hourly, one batched record per group (the lp service)"
    url: /cron/ud
    target: lp
    schedule: every 1 hours
